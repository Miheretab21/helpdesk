<div class="create-ticket">
  <header class="create-ticket__header">
    <div><p class="form-eyebrow">NEW REQUEST</p><h1>Tell us what you need</h1><p>Give the support team enough context to resolve this quickly.</p></div>
    <a routerLink="/" class="create-ticket__back">← Back to list</a>
  </header>

  <form class="create-ticket__form" (ngSubmit)="submit()">
    <label>
      <span>What needs attention?</span>
      <input
        type="text"
        [(ngModel)]="title"
        name="title"
        maxlength="200"
        placeholder="Short summary of the issue"
        required />
    </label>

    <label>
      <span>Describe the issue</span>
      <textarea
        [(ngModel)]="description"
        name="description"
        rows="6"
        maxlength="4000"
        placeholder="What happened? Include any details that might help."
        required></textarea>
    </label>

    <label>
      <span>Category</span>
      <select [(ngModel)]="categoryId" name="categoryId" required>
        <option value="''">Select a category…</option>
        @for (category of categories.value(); track category.id) {
          <option [value]="category.id">{{ category.name }}</option>
        }
      </select>
    </label>

    <label>
      <span>Priority</span>
      <select [value]="priority()" (change)="onPriorityChange($event)" name="priority" required>
        @for (p of priorities; track p.value) {
          <option [value]="p.value">{{ p.label }}</option>
        }
      </select>
    </label>

    @if (error()) {
      <p class="create-ticket__error">{{ error() }}</p>
    }

    <div class="create-ticket__actions">
      <button type="button" routerLink="/" class="btn btn--secondary">Cancel</button>
      <button type="submit" class="btn btn--primary" [disabled]="!canSubmit()">
        {{ submitting() ? 'Creating…' : 'Create Ticket' }}
      </button>
    </div>
  </form>
</div>
