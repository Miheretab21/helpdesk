<div class="shell">
  <header class="shell__header">
    <a routerLink="/" class="shell__brand"><span class="shell__mark">✦</span><span>HelpDesk</span><em>OPERATIONS</em></a>

    <div class="shell__user">
      @if (auth.user(); as user) {
        <span class="shell__identity"><strong>{{ user.fullName }}</strong><span>{{ UserRole[user.role] }}</span></span>
        <button type="button" class="shell__logout" (click)="auth.logout()">Sign out</button>
      }
    </div>
  </header>

  <main class="shell__content">
    <router-outlet />
  </main>

  <app-toast-container />
</div>
